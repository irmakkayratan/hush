<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HUSH demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #111; font: 1rem/1.5 Arial, sans-serif; }
    main { max-width: 38rem; margin: auto; padding: clamp(1.25rem, 5vw, 2.5rem); }
    h1 { margin: 0; font-size: 2.5rem; letter-spacing: -.065em; }
    h1 span { color: #62816c; }
    h2 { margin: 0 0 .5rem; font-size: 1.25rem; }
    p { margin: .5rem 0 1rem; }
    label { display: block; margin-top: 1rem; font-weight: bold; }
    textarea, select { display: block; width: 100%; border: 1px solid #555; padding: .75rem; font: inherit; }
    button { margin-top: 1rem; border: 1px solid #111; border-radius: 999px; background: #111; color: white;
      padding: .7rem 1.2rem; font: inherit; cursor: pointer; }
    a:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid #4a6956; outline-offset: 3px; }
    .review { border: 1px solid #ddd; border-radius: 1rem; padding: 1.25rem; margin-top: 1.5rem; }
    .hint { color: #555; }
    button:disabled { opacity: .5; cursor: default; }
    section + section { margin-top: 2rem; }
    a { color: #355544; }
  </style>
  <script src="./demo.js" defer></script>
</head>
<body>
  <main>
    <h1>hush<span>.</span></h1>
    <p class="hint">Portfolio demo. Try the connection check and note workflow with fictional tasks.</p>
    <section aria-labelledby="connection-heading">
      <h2 id="connection-heading">Connect a Notion task list</h2>
      <p class="hint">Simulated connection to Demo Studio’s task list.</p>
      <button id="check-connection" type="button">Check demo connection</button>
      <button id="create-test" type="button" disabled>Create demo test task</button>
      <p id="connection-result" role="status"></p>
      <a href="./sample-tasks.csv" download>Download sample tasks (CSV)</a>
    </section>
    <section aria-labelledby="note-heading">
      <h2 id="note-heading">Review a note</h2>
      <form id="draft">
        <label for="example">Example note</label>
        <select id="example">
          <option value="announcement">Launch announcement</option>
          <option value="homepage">Homepage review</option>
        </select>
        <label for="note">Original note</label>
        <textarea id="note" rows="3" readonly>I have started the launch announcement and gathered references. I will share a draft tomorrow.</textarea>
        <button>Analyze note</button>
      </form>
      <form id="review" class="review" hidden>
        <h2 id="task" tabindex="-1"></h2>
        <label for="update">Suggested update</label>
        <textarea id="update" rows="3" readonly></textarea>
        <label for="status">Status after confirmation</label>
        <select id="status" required></select>
        <button>Confirm demo update</button>
      </form>
      <p id="result" role="status"></p>
    </section>
  </main>
</body>
</html>
